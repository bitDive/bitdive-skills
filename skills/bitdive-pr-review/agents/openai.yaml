interface:
  display_name: "BitDive PR Review"
  short_description: "Compare PR runtime behavior before and after"
  default_prompt: "Use $bitdive-pr-review to produce the standardized runtime review with fixed sections and fixed table schemas. Use Summary, What Changed, What Did Not Change, Replay Regression Tests, Follow-Ups, and Final Recommendation. In What Changed, use the required Layer | Before PR | After PR | Change table. In Replay Regression Tests, report UNIT and COMPONENT separately."
policy:
  allow_implicit_invocation: true
